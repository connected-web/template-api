name: Release Package Deploy

on:
  workflow_call:
    inputs:
      environment_name:
        required: true
        type: string
      target_profile:
        required: true
        type: string
      target_instance_id:
        required: true
        type: string
      hosted_zone_domain:
        required: true
        type: string
      package_version:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      publish_enabled:
        required: true
        type: boolean
      deploy_enabled:
        required: true
        type: boolean

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    env:
      NODE_AUTH_TOKEN: ${{ secrets.CONNECTED_WEB_PACKAGES_TOKEN != '' && secrets.CONNECTED_WEB_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
      CWEB_CLIENT_ID: ${{ secrets.CWEB_CLIENT_ID }}
      CWEB_CLIENT_SECRET: ${{ secrets.CWEB_CLIENT_SECRET }}
      CWEB_CLIENT_TYPE: ${{ secrets.CWEB_CLIENT_TYPE }}
      IDENTITY_AUTHORIZER_ARN: ${{ vars.IDENTITY_AUTHORIZER_ARN }}
      TARGET_PROFILE: ${{ inputs.target_profile }}
      TARGET_INSTANCE_ID: ${{ inputs.target_instance_id }}
      HOSTED_ZONE_DOMAIN: ${{ inputs.hosted_zone_domain }}
      PACKAGE_VERSION: ${{ inputs.package_version }}
      RELEASE_TAG: ${{ inputs.release_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node JS LTS
        uses: actions/setup-node@v6
        with:
          node-version: 20.x
          registry-url: https://npm.pkg.github.com
          scope: '@connected-web'

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run test

      - name: Install cweb CLI
        run: npm install -g @connected-web/cweb

      - name: Resolve deploy config
        run: |
          set -euo pipefail
          authorizer_arn="${IDENTITY_AUTHORIZER_ARN:-}"
          if [ -z "$authorizer_arn" ]; then
            runtime_context="$(cweb -p "$TARGET_PROFILE" curl -sS "https://management-api.${HOSTED_ZONE_DOMAIN}/resources/runtime-context")"
            authorizer_arn="$(printf '%s' "$runtime_context" | jq -r '.identity.authorizerArn // empty')"
          fi
          if [ -z "$authorizer_arn" ]; then
            echo "Unable to resolve IdentityAuthorizerArn." >&2
            printf '%s\n' "${runtime_context:-}" >&2
            exit 1
          fi
          deploy_config="$(jq -cn \
            --arg subdomain "$TARGET_INSTANCE_ID" \
            --arg hostedZoneDomain "$HOSTED_ZONE_DOMAIN" \
            --arg authorizerArn "$authorizer_arn" \
            --arg releaseTag "$RELEASE_TAG" \
            --arg packageVersion "$PACKAGE_VERSION" \
            '{
              Subdomain: $subdomain,
              HostedZoneDomain: $hostedZoneDomain,
              IdentityAuthorizerArn: $authorizerArn,
              RELEASETAGDEFAULT: $releaseTag,
              PACKAGEVERSIONDEFAULT: $packageVersion
            }')"
          echo "DEPLOY_CONFIG=$deploy_config" >> "$GITHUB_ENV"

      - name: Pack template-api package
        if: ${{ inputs.publish_enabled }}
        run: |
          artifact="/tmp/template-api-${PACKAGE_VERSION}.cweb.pkg"
          cweb package pack --component template-api --version "$PACKAGE_VERSION" --output "$artifact"
          echo "PACKAGE_ARTIFACT=$artifact" >> "$GITHUB_ENV"

      - name: Publish template-api package to registry
        if: ${{ inputs.publish_enabled }}
        env:
          REGISTRY_API_BASE_URL: https://registry-api.resources.connected-web.services
          CWEB_CLIENT_ID: ${{ vars.REGISTRY_API_CLIENT_ID != '' && vars.REGISTRY_API_CLIENT_ID || secrets.CWEB_CLIENT_ID }}
          CWEB_CLIENT_SECRET: ${{ secrets.REGISTRY_API_CLIENT_SECRET != '' && secrets.REGISTRY_API_CLIENT_SECRET || secrets.CWEB_CLIENT_SECRET }}
          CWEB_CLIENT_TYPE: ${{ vars.REGISTRY_API_CLIENT_TYPE != '' && vars.REGISTRY_API_CLIENT_TYPE || secrets.CWEB_CLIENT_TYPE }}
        run: cweb -p resources package publish --target registry-api --component template-api --version "$PACKAGE_VERSION" --artifact "$PACKAGE_ARTIFACT" --if-exists-skip

      - name: Deploy template-api package
        if: ${{ inputs.deploy_enabled }}
        env:
          MANAGEMENT_API_BASE_URL: https://management-api.${{ inputs.hosted_zone_domain }}
        run: |
          cweb -p "$TARGET_PROFILE" package deploy \
            --host remote \
            --component template-api \
            --version "$PACKAGE_VERSION" \
            --instance-id "$TARGET_INSTANCE_ID" \
            --config "$DEPLOY_CONFIG" \
            --view detailed \
            --timeout 900 \
            --watch

      - name: Summary
        run: |
          echo "${TARGET_PROFILE} deployment complete: https://${TARGET_INSTANCE_ID}.${HOSTED_ZONE_DOMAIN}"
