name: Release Deploy Prod

on:
  release:
    types:
      - released
      - prereleased
  workflow_dispatch:
    inputs:
      release_type:
        description: Release type to deploy
        required: true
        type: choice
        options:
          - release
          - release-candidate
        default: release
      tag_name:
        description: Release tag to deploy
        required: true
        type: string
      deploy_enabled:
        description: Deploy after publishing package
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  packages: read

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    environment: dev
    env:
      NODE_AUTH_TOKEN: ${{ secrets.CONNECTED_WEB_PACKAGES_TOKEN != '' && secrets.CONNECTED_WEB_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
      CWEB_CLIENT_ID: ${{ secrets.CWEB_CLIENT_ID }}
      CWEB_CLIENT_SECRET: ${{ secrets.CWEB_CLIENT_SECRET }}
      CWEB_CLIENT_TYPE: ${{ secrets.CWEB_CLIENT_TYPE }}
      CWEB_ACCOUNTS_DIR: ${{ github.workspace }}/.github/workflows/accounts
      TARGET_PROFILE: dev
      TARGET_INSTANCE_ID: template-api
      RELEASE_TYPE: ${{ github.event_name == 'release' && (github.event.release.prerelease && 'release-candidate' || 'release') || inputs.release_type }}
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node JS LTS
        uses: actions/setup-node@v6
        with:
          node-version: 20.x
          registry-url: https://npm.pkg.github.com
          scope: '@connected-web'

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run test

      - name: Install cweb CLI
        run: npm install -g @connected-web/cweb

      - name: Resolve release version
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG#v}"
          if [ -z "$TAG" ]; then
            echo "Missing release tag" >&2
            exit 1
          fi

          case "$RELEASE_TYPE" in
            release)
              PACKAGE_VERSION="$TAG"
              ;;
            release-candidate)
              PACKAGE_VERSION="${TAG}-rc.${GITHUB_RUN_NUMBER}"
              ;;
            *)
              echo "Unsupported release type: $RELEASE_TYPE" >&2
              exit 1
              ;;
          esac

          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"

      - name: Resolve account config
        run: cweb configure -p "$TARGET_PROFILE" --write-github-env

      - name: Login cweb machine identity
        run: cweb login -p "$TARGET_PROFILE" --user-pool-id "$USER_POOL_ID" --get-access-token --machine > /dev/null

      - name: Resolve deploy config
        run: |
          set -euo pipefail
          if jq -e . >/dev/null 2>&1 <<<"$AWS_ACCOUNT_CONFIG"; then
            ACCOUNT_CONFIG_JSON="$AWS_ACCOUNT_CONFIG"
          else
            ACCOUNT_CONFIG_JSON="$(echo "$AWS_ACCOUNT_CONFIG" | base64 -d)"
          fi

          AUTHORIZER_ARN="${IDENTITY_AUTHORIZER_ARN:-$(jq -r '.identity.authorizerArn // empty' <<<"$ACCOUNT_CONFIG_JSON")}"
          HOSTED_ZONE_DOMAIN="$(jq -r '.hostedZoneDomain // empty' <<<"$ACCOUNT_CONFIG_JSON")"
          HOSTED_ZONE_ID="$(jq -r '.hostedZoneId // empty' <<<"$ACCOUNT_CONFIG_JSON")"

          if [ -z "$HOSTED_ZONE_DOMAIN" ] || [ -z "$AUTHORIZER_ARN" ]; then
            echo "Unable to resolve HostedZoneDomain or IDENTITY_AUTHORIZER_ARN from cweb account config." >&2
            exit 1
          fi

          DEPLOY_CONFIG_JSON="$(jq -cn \
            --arg subdomain "$TARGET_INSTANCE_ID" \
            --arg hostedZoneDomain "$HOSTED_ZONE_DOMAIN" \
            --arg hostedZoneId "$HOSTED_ZONE_ID" \
            --arg authorizerArn "$AUTHORIZER_ARN" \
            '{
              Subdomain: $subdomain,
              HostedZoneDomain: $hostedZoneDomain,
              IDENTITY_AUTHORIZER_ARN: $authorizerArn
            }
            + (if ($hostedZoneId | length) > 0 then { HostedZoneId: $hostedZoneId } else {} end)')"

          echo "DEPLOY_CONFIG=$DEPLOY_CONFIG_JSON" >> "$GITHUB_ENV"
          echo "DEPLOY_BASE_URL=https://${TARGET_INSTANCE_ID}.${HOSTED_ZONE_DOMAIN}" >> "$GITHUB_ENV"

      - name: Pack template-api package
        run: |
          artifact="/tmp/template-api-${PACKAGE_VERSION}.cweb.pkg"
          cweb -p "$TARGET_PROFILE" --user-pool-id "$USER_POOL_ID" package pack --component template-api --version "$PACKAGE_VERSION" --output "$artifact"
          echo "PACKAGE_ARTIFACT=$artifact" >> "$GITHUB_ENV"

      - name: Publish template-api package to registry
        env:
          REGISTRY_API_BASE_URL: https://registry-api.resources.connected-web.services
          CWEB_CLIENT_ID: ${{ vars.REGISTRY_API_CLIENT_ID }}
          CWEB_CLIENT_SECRET: ${{ secrets.REGISTRY_API_CLIENT_SECRET }}
          CWEB_CLIENT_TYPE: ${{ vars.REGISTRY_API_CLIENT_TYPE }}
        run: cweb -p resources package publish --target registry-api --component template-api --version "$PACKAGE_VERSION" --artifact "$PACKAGE_ARTIFACT" --if-exists-skip

      - name: Deploy template-api package to dev
        env:
          MANAGEMENT_API_BASE_URL: https://management-api.dev.connected-web.services
        run: |
          cweb -p "$TARGET_PROFILE" package deploy \
            --host remote \
            --component template-api \
            --version "$PACKAGE_VERSION" \
            --instance-id "$TARGET_INSTANCE_ID" \
            --config "$DEPLOY_CONFIG" \
            --watch

      - name: Summary
        run: |
          echo "Development deployment complete (${RELEASE_TYPE}): ${DEPLOY_BASE_URL}"

  deploy-prod:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: prod
    env:
      NODE_AUTH_TOKEN: ${{ secrets.CONNECTED_WEB_PACKAGES_TOKEN != '' && secrets.CONNECTED_WEB_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
      CWEB_CLIENT_ID: ${{ secrets.CWEB_CLIENT_ID }}
      CWEB_CLIENT_SECRET: ${{ secrets.CWEB_CLIENT_SECRET }}
      CWEB_CLIENT_TYPE: ${{ secrets.CWEB_CLIENT_TYPE }}
      CWEB_ACCOUNTS_DIR: ${{ github.workspace }}/.github/workflows/accounts
      TARGET_PROFILE: prod
      TARGET_INSTANCE_ID: template-api
      RELEASE_TYPE: ${{ github.event_name == 'release' && (github.event.release.prerelease && 'release-candidate' || 'release') || inputs.release_type }}
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node JS LTS
        uses: actions/setup-node@v6
        with:
          node-version: 20.x
          registry-url: https://npm.pkg.github.com
          scope: '@connected-web'

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run test

      - name: Install cweb CLI
        run: npm install -g @connected-web/cweb

      - name: Resolve release version
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG#v}"
          if [ -z "$TAG" ]; then
            echo "Missing release tag" >&2
            exit 1
          fi

          case "$RELEASE_TYPE" in
            release)
              PACKAGE_VERSION="$TAG"
              ;;
            release-candidate)
              PACKAGE_VERSION="${TAG}-rc.${GITHUB_RUN_NUMBER}"
              ;;
            *)
              echo "Unsupported release type: $RELEASE_TYPE" >&2
              exit 1
              ;;
          esac

          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"

      - name: Resolve account config
        run: cweb configure -p "$TARGET_PROFILE" --write-github-env

      - name: Login cweb machine identity
        run: cweb login -p "$TARGET_PROFILE" --user-pool-id "$USER_POOL_ID" --get-access-token --machine > /dev/null

      - name: Resolve deploy config
        run: |
          set -euo pipefail
          if jq -e . >/dev/null 2>&1 <<<"$AWS_ACCOUNT_CONFIG"; then
            ACCOUNT_CONFIG_JSON="$AWS_ACCOUNT_CONFIG"
          else
            ACCOUNT_CONFIG_JSON="$(echo "$AWS_ACCOUNT_CONFIG" | base64 -d)"
          fi

          AUTHORIZER_ARN="${IDENTITY_AUTHORIZER_ARN:-$(jq -r '.identity.authorizerArn // empty' <<<"$ACCOUNT_CONFIG_JSON")}"
          HOSTED_ZONE_DOMAIN="$(jq -r '.hostedZoneDomain // empty' <<<"$ACCOUNT_CONFIG_JSON")"
          HOSTED_ZONE_ID="$(jq -r '.hostedZoneId // empty' <<<"$ACCOUNT_CONFIG_JSON")"

          if [ -z "$HOSTED_ZONE_DOMAIN" ] || [ -z "$AUTHORIZER_ARN" ]; then
            echo "Unable to resolve HostedZoneDomain or IDENTITY_AUTHORIZER_ARN from cweb account config." >&2
            exit 1
          fi

          DEPLOY_CONFIG_JSON="$(jq -cn \
            --arg subdomain "$TARGET_INSTANCE_ID" \
            --arg hostedZoneDomain "$HOSTED_ZONE_DOMAIN" \
            --arg hostedZoneId "$HOSTED_ZONE_ID" \
            --arg authorizerArn "$AUTHORIZER_ARN" \
            '{
              Subdomain: $subdomain,
              HostedZoneDomain: $hostedZoneDomain,
              IDENTITY_AUTHORIZER_ARN: $authorizerArn
            }
            + (if ($hostedZoneId | length) > 0 then { HostedZoneId: $hostedZoneId } else {} end)')"

          echo "DEPLOY_CONFIG=$DEPLOY_CONFIG_JSON" >> "$GITHUB_ENV"

      - name: Pack template-api package
        run: |
          artifact="/tmp/template-api-${PACKAGE_VERSION}.cweb.pkg"
          cweb -p "$TARGET_PROFILE" --user-pool-id "$USER_POOL_ID" package pack --component template-api --version "$PACKAGE_VERSION" --output "$artifact"
          echo "PACKAGE_ARTIFACT=$artifact" >> "$GITHUB_ENV"

      - name: Publish template-api package to registry
        env:
          REGISTRY_API_BASE_URL: https://registry-api.resources.connected-web.services
          CWEB_CLIENT_ID: ${{ vars.REGISTRY_API_CLIENT_ID }}
          CWEB_CLIENT_SECRET: ${{ secrets.REGISTRY_API_CLIENT_SECRET }}
          CWEB_CLIENT_TYPE: ${{ vars.REGISTRY_API_CLIENT_TYPE }}
        run: cweb -p resources package publish --target registry-api --component template-api --version "$PACKAGE_VERSION" --artifact "$PACKAGE_ARTIFACT" --if-exists-skip

      - name: Deploy template-api package to prod
        if: ${{ github.event_name == 'release' || inputs.deploy_enabled == true }}
        env:
          MANAGEMENT_API_BASE_URL: https://management-api.prod.connected-web.services
        run: |
          cweb -p "$TARGET_PROFILE" package deploy \
            --host remote \
            --component template-api \
            --version "$PACKAGE_VERSION" \
            --instance-id "$TARGET_INSTANCE_ID" \
            --config "$DEPLOY_CONFIG" \
            --watch

      - name: Summary
        run: |
          echo "Production deployment complete (${RELEASE_TYPE}): https://template-api.prod.connected-web.services"
