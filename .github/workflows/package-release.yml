name: Package Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      account:
        description: "Target AWS account alias"
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev
      version:
        description: "Release version (without v prefix), required for manual runs"
        required: false
        type: string
      instance_id:
        description: "Deployment instance ID"
        required: true
        type: string
        default: template-api
      deploy_enabled:
        description: "Deploy package after publish"
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  packages: read

jobs:
  package-release:
    name: Pack/Publish/Deploy release
    runs-on: ubuntu-latest
    environment: dev
    env:
      NODE_AUTH_TOKEN: ${{ secrets.CONNECTED_WEB_PACKAGES_TOKEN }}
      CWEB_CLIENT_ID: ${{ secrets.CWEB_CLIENT_ID }}
      CWEB_CLIENT_SECRET: ${{ secrets.CWEB_CLIENT_SECRET }}
      CWEB_CLIENT_TYPE: ${{ secrets.CWEB_CLIENT_TYPE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node JS LTS
        uses: actions/setup-node@v6
        with:
          node-version: 20.x
          registry-url: https://npm.pkg.github.com
          scope: '@connected-web'

      - name: Install dependencies
        run: npm ci

      - name: Install cweb CLI
        run: npm install -g @connected-web/cweb

      - name: Resolve account/profile
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            ACCOUNT="dev"
            VERSION="${GITHUB_REF_NAME#v}"
          else
            ACCOUNT="${{ github.event.inputs.account }}"
            VERSION="${{ github.event.inputs.version }}"
          fi

          if [ -z "$VERSION" ]; then
            echo "Release version is required for manual runs" >&2
            exit 1
          fi

          case "$ACCOUNT" in
            dev)
              PROFILE="dev"
              ;;
            prod)
              PROFILE="prod"
              ;;
            *)
              echo "Unsupported account: $ACCOUNT" >&2
              exit 1
              ;;
          esac

          echo "TARGET_ACCOUNT=$ACCOUNT" >> "$GITHUB_ENV"
          echo "TARGET_PROFILE=$PROFILE" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Resolve deploy config
        run: |
          set -euo pipefail
          if [ "$TARGET_PROFILE" = "dev" ]; then
            HOSTED_ZONE_DOMAIN="${HOSTED_ZONE_DOMAIN:-template-api.dev.connected-web.services}"
            IDENTITY_AUTHORIZER_ARN="${IDENTITY_AUTHORIZER_ARN:-arn:aws:lambda:eu-west-2:807726400201:function:CWEB-management-api-manag-ManagedIdentityAuthorize-F8oxeIR3A6Og}"
          else
            HOSTED_ZONE_DOMAIN="${HOSTED_ZONE_DOMAIN:-template-api.prod.connected-web.services}"
            IDENTITY_AUTHORIZER_ARN="${IDENTITY_AUTHORIZER_ARN:-arn:aws:lambda:eu-west-2:794722618463:function:CWEB-management-api-manag-ManagedIdentityAuthorize-ibW9ZdRWnkJb}"
          fi
          if [ "${{ github.event_name }}" = "push" ]; then
            DEPLOY_INSTANCE_ID="template-api"
          else
            DEPLOY_INSTANCE_ID="${{ github.event.inputs.instance_id }}"
          fi

          DEPLOY_CONFIG_JSON="$(jq -cn \
            --arg subdomain "$DEPLOY_INSTANCE_ID" \
            --arg hostedZoneDomain "$HOSTED_ZONE_DOMAIN" \
            --arg authorizerArn "$IDENTITY_AUTHORIZER_ARN" \
            '{
              Subdomain: $subdomain,
              HostedZoneDomain: $hostedZoneDomain,
              IDENTITY_AUTHORIZER_ARN: $authorizerArn
            }')"
          echo "DEPLOY_INSTANCE_ID=$DEPLOY_INSTANCE_ID" >> "$GITHUB_ENV"
          echo "DEPLOY_CONFIG=$DEPLOY_CONFIG_JSON" >> "$GITHUB_ENV"

      - name: Pack template-api package
        run: cweb -p "$TARGET_PROFILE" package pack --component template-api --version "$PACKAGE_VERSION"

      - name: Publish template-api package
        run: cweb -p "$TARGET_PROFILE" package publish --component template-api --version "$PACKAGE_VERSION"

      - name: Publish to registry
        env:
          REGISTRY_API_BASE_URL: https://registry-api.resources.connected-web.services
          CWEB_CLIENT_ID: ${{ vars.REGISTRY_API_CLIENT_ID }}
          CWEB_CLIENT_TYPE: ${{ vars.REGISTRY_API_CLIENT_TYPE }}
          CWEB_CLIENT_SECRET: ${{ secrets.REGISTRY_API_CLIENT_SECRET }}
        run: cweb -p "$TARGET_PROFILE" package publish --target registry-api --component template-api --version "$PACKAGE_VERSION" --artifact ".cweb/dist/template-api-${PACKAGE_VERSION}.cweb.pkg"

      - name: Deploy template-api package
        if: ${{ github.event_name == 'push' || github.event.inputs.deploy_enabled == 'true' }}
        run: |
          cweb -p "$TARGET_PROFILE" package deploy \
            --host remote \
            --component template-api \
            --version "$PACKAGE_VERSION" \
            --instance-id "$DEPLOY_INSTANCE_ID" \
            --config "$DEPLOY_CONFIG"
