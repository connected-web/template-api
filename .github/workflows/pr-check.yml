name: Check PR
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  test-cdk-api:
    name: Test CDK API
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.CONNECTED_WEB_PACKAGES_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Use Node JS LTS
        uses: actions/setup-node@v6
        with:
          node-version: 20.x
          registry-url: https://npm.pkg.github.com
          scope: '@connected-web'

      - name: Install npm dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

  package-deploy-dev:
    name: Package and deploy API to dev
    needs: ['test-cdk-api']
    runs-on: ubuntu-latest
    environment: dev
    env:
      NODE_AUTH_TOKEN: ${{ secrets.CONNECTED_WEB_PACKAGES_TOKEN != '' && secrets.CONNECTED_WEB_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
      CWEB_CLIENT_ID: ${{ secrets.CWEB_CLIENT_ID }}
      CWEB_CLIENT_SECRET: ${{ secrets.CWEB_CLIENT_SECRET }}
      CWEB_CLIENT_TYPE: ${{ secrets.CWEB_CLIENT_TYPE }}
      IDENTITY_AUTHORIZER_ARN: ${{ vars.IDENTITY_AUTHORIZER_ARN }}
      TARGET_PROFILE: dev
      TARGET_INSTANCE_ID: template-api

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node JS LTS
        uses: actions/setup-node@v6
        with:
          node-version: 20.x
          registry-url: https://npm.pkg.github.com
          scope: '@connected-web'

      - name: Install dependencies
        run: npm ci

      - name: Install cweb CLI
        run: npm install -g @connected-web/cweb

      - name: Bootstrap cweb account config
        run: |
          set -euo pipefail
          accounts_dir="$RUNNER_TEMP/cweb-accounts"
          state_dir="$HOME/.cweb"
          mkdir -p "$accounts_dir" "$state_dir"
          curl -fsS https://management-ui.org.connected-web.services/known-accounts.json > "$RUNNER_TEMP/known-accounts.json"
          node <<'NODE'
          const fs = require('fs')
          const os = require('os')
          const path = require('path')
          const manifest = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'known-accounts.json'), 'utf8'))
          const accountsDir = path.join(process.env.RUNNER_TEMP, 'cweb-accounts')
          const aliases = {}
          for (const account of manifest.accounts || []) {
            if (!account.accountName || !account.environment) continue
            aliases[account.environment] = account.accountName
            fs.writeFileSync(path.join(accountsDir, `${account.accountName}.json`), JSON.stringify({
              accountId: account.accountId,
              accountName: account.accountName,
              service: 'connected-web',
              environment: account.environment,
              parentZone: account.parentZone || 'connected-web.services',
              rootZones: account.rootZones,
              identity: manifest.identity
            }, null, 2))
          }
          fs.writeFileSync(path.join(os.homedir(), '.cweb', 'state.json'), JSON.stringify({
            lastAccountsDir: accountsDir,
            profileAliases: aliases
          }, null, 2))
          NODE
          echo "CWEB_ACCOUNTS_DIR=$accounts_dir" >> "$GITHUB_ENV"

      - name: Resolve package version
        run: echo "PACKAGE_VERSION=0.0.0-pr.${{ github.event.pull_request.number || github.run_number }}.${{ github.run_number }}.${{ github.run_attempt }}" >> "$GITHUB_ENV"

      - name: Resolve deploy config
        run: |
          set -euo pipefail
          HOSTED_ZONE_DOMAIN="${HOSTED_ZONE_DOMAIN:-dev.connected-web.services}"
          if [ -z "$HOSTED_ZONE_DOMAIN" ]; then
            echo "Missing HOSTED_ZONE_DOMAIN workflow var." >&2
            exit 1
          fi
          IDENTITY_AUTHORIZER_ARN="${IDENTITY_AUTHORIZER_ARN:-}"
          if [ -z "$IDENTITY_AUTHORIZER_ARN" ]; then
            RUNTIME_CONTEXT_JSON="$(cweb -p "$TARGET_PROFILE" curl -sS "https://management-api.${HOSTED_ZONE_DOMAIN}/resources/runtime-context")"
            IDENTITY_AUTHORIZER_ARN="$(printf '%s' "$RUNTIME_CONTEXT_JSON" | jq -r '.identity.authorizerArn // empty')"
          fi
          if [ -z "$IDENTITY_AUTHORIZER_ARN" ]; then
            echo "Unable to resolve IDENTITY_AUTHORIZER_ARN from management-api runtime context." >&2
            printf '%s\n' "${RUNTIME_CONTEXT_JSON:-}" >&2
            exit 1
          fi

          DEPLOY_CONFIG_JSON="$(jq -cn \
            --arg subdomain "$TARGET_INSTANCE_ID" \
            --arg hostedZoneDomain "$HOSTED_ZONE_DOMAIN" \
            --arg authorizerArn "$IDENTITY_AUTHORIZER_ARN" \
            --arg packageVersion "$PACKAGE_VERSION" \
            '{
              Subdomain: $subdomain,
              HostedZoneDomain: $hostedZoneDomain,
              IdentityAuthorizerArn: $authorizerArn,
              RELEASETAGDEFAULT: "",
              PACKAGEVERSIONDEFAULT: $packageVersion
            }')"

          echo "DEPLOY_CONFIG=$DEPLOY_CONFIG_JSON" >> "$GITHUB_ENV"
          echo "DEPLOY_BASE_URL=https://${TARGET_INSTANCE_ID}.${HOSTED_ZONE_DOMAIN}" >> "$GITHUB_ENV"

      - name: Pack template-api package
        run: |
          artifact="/tmp/template-api-${PACKAGE_VERSION}.cweb.pkg"
          cweb package pack --component template-api --version "$PACKAGE_VERSION" --output "$artifact"
          echo "PACKAGE_ARTIFACT=$artifact" >> "$GITHUB_ENV"

      - name: Publish template-api package to registry
        env:
          REGISTRY_API_BASE_URL: https://registry-api.resources.connected-web.services
          CWEB_CLIENT_ID: ${{ vars.REGISTRY_API_CLIENT_ID != '' && vars.REGISTRY_API_CLIENT_ID || secrets.CWEB_CLIENT_ID }}
          CWEB_CLIENT_SECRET: ${{ secrets.REGISTRY_API_CLIENT_SECRET != '' && secrets.REGISTRY_API_CLIENT_SECRET || secrets.CWEB_CLIENT_SECRET }}
          CWEB_CLIENT_TYPE: ${{ vars.REGISTRY_API_CLIENT_TYPE != '' && vars.REGISTRY_API_CLIENT_TYPE || secrets.CWEB_CLIENT_TYPE }}
        run: cweb -p resources package publish --target registry-api --component template-api --version "$PACKAGE_VERSION" --artifact "$PACKAGE_ARTIFACT" --if-exists-skip

      - name: Deploy template-api package to dev
        env:
          MANAGEMENT_API_BASE_URL: https://management-api.dev.connected-web.services
        run: |
          set -euo pipefail
          cweb -p "$TARGET_PROFILE" package deploy \
            --host remote \
            --component template-api \
            --version "$PACKAGE_VERSION" \
            --instance-id "$TARGET_INSTANCE_ID" \
            --config "$DEPLOY_CONFIG" \
            --view detailed \
            --timeout 900 \
            --watch

      - name: Smoke test deployed API
        env:
          POST_DEPLOYMENT_SERVER_DOMAIN: ${{ env.DEPLOY_BASE_URL }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const dns = require('node:dns').promises
          const https = require('node:https')

          const baseUrl = process.env.POST_DEPLOYMENT_SERVER_DOMAIN
          if (!baseUrl) throw new Error('POST_DEPLOYMENT_SERVER_DOMAIN is required')
          const hostname = new URL(baseUrl).hostname
          const deadline = Date.now() + 10 * 60 * 1000

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms))
          const requestJson = (url) => new Promise((resolve, reject) => {
            const req = https.get(url, { timeout: 15000 }, (res) => {
              let body = ''
              res.setEncoding('utf8')
              res.on('data', (chunk) => { body += chunk })
              res.on('end', () => {
                if (res.statusCode !== 200) {
                  reject(new Error(`${url} returned ${res.statusCode}: ${body.slice(0, 500)}`))
                  return
                }
                try {
                  resolve(JSON.parse(body))
                } catch (error) {
                  reject(new Error(`${url} returned invalid JSON: ${error.message}`))
                }
              })
            })
            req.on('timeout', () => req.destroy(new Error(`${url} timed out`)))
            req.on('error', reject)
          })

          ;(async () => {
            let lastError
            while (Date.now() < deadline) {
              try {
                await dns.resolve(hostname)
                const openapi = await requestJson(`${baseUrl}/openapi`)
                if (!openapi?.paths?.['/status']) throw new Error('/openapi did not include /status')
                console.log('Public smoke checks passed:', { baseUrl })
                return
              } catch (error) {
                lastError = error
                console.log(`Waiting for deployed API: ${error.message}`)
                await sleep(15000)
              }
            }
            throw lastError ?? new Error('Timed out waiting for deployed API')
          })().catch((error) => {
            console.error(error)
            process.exit(1)
          })
          NODE

      - name: Verify deployed status metadata
        run: |
          set -euo pipefail
          status_json="$(cweb -p "$TARGET_PROFILE" curl -sS "$DEPLOY_BASE_URL/status")"
          actual_package_version="$(printf '%s' "$status_json" | jq -r '.packageVersion // empty')"
          if [ "$actual_package_version" != "$PACKAGE_VERSION" ]; then
            echo "Expected /status packageVersion '$PACKAGE_VERSION', got '$actual_package_version'." >&2
            printf '%s\n' "$status_json" >&2
            exit 1
          fi
          printf '%s\n' "$status_json" | jq '{ok, service, releaseTag, packageVersion, buildVersion}'
